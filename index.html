<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one column field tool; sticky bar on top, sections as black bands like the paper form, J/N as large tap targets.
   Ground colour borrows from RAL 7035 (cabinet grey). */
:root {
  --bg: #e6e8e6;
  --surface: #f7f8f7;
  --fg: #1d2328;
  --muted: #5b6670;
  --line: #c9cecd;
  --band: #15191c;
  --band-fg: #f3f5f4;
  --accent: #1f5f8b;
  --accent-soft: #d6e5f0;
  --ok: #1e7a45;
  --ok-soft: #d5ecdd;
  --bad: #b3261e;
  --bad-soft: #f6d9d6;
  --font: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121517; --surface: #1b2023; --fg: #e4e8ea; --muted: #97a2ab; --line: #2f373c;
    --band: #000000; --band-fg: #e9eef0; --accent: #6fb0de; --accent-soft: #1d3446;
    --ok: #5fc98a; --ok-soft: #173525; --bad: #f08a80; --bad-soft: #42201d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121517; --surface: #1b2023; --fg: #e4e8ea; --muted: #97a2ab; --line: #2f373c;
  --band: #000000; --band-fg: #e9eef0; --accent: #6fb0de; --accent-soft: #1d3446;
  --ok: #5fc98a; --ok-soft: #173525; --bad: #f08a80; --bad-soft: #42201d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2 { margin: 0; text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; min-height: 56px; }
.bar h1 { font-size: 17px; font-weight: 700; letter-spacing: .01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .sub { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: default; }
.iconbtn { border: none; background: none; padding: 6px 8px; font-size: 20px; line-height: 1; color: var(--fg); border-radius: 8px; }

main { padding-block: 20px 60px; }
.note { font-size: 13px; color: var(--muted); }
.banner { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

/* list */
.listhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.listhead h2 { font-size: 22px; }
.cards { display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; text-align: left; width: 100%; }
.card:hover { border-color: var(--accent); }
.cardrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.delbtn { width: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--muted); display: grid; place-items: center; }
.delbtn:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.card .t { font-weight: 600; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.card .m { font-size: 13px; color: var(--muted); grid-column: 1; }
.card .stat { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: 13px; }
.card .stat b { font-size: 18px; display: block; }
.meter { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; }
.meter i { display: block; height: 100%; }
.meter .j { background: var(--ok); } .meter .n { background: var(--bad); } .meter .e { background: var(--muted); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; }
.empty p { margin: 6px 0 16px; color: var(--muted); }

/* form */
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 16px; }
.form label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.form input { border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; background: var(--bg); font-size: 15px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--fg); min-width: 0; }
.form .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }

/* detail */
.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 12px; font-size: 14px; }
.summary .meter { flex: 1 0 100%; height: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

.sect { margin-bottom: 14px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.sect > button { width: 100%; display: flex; gap: 12px; align-items: baseline; background: var(--band); color: var(--band-fg); border: none; padding: 11px 14px; text-align: left; font-weight: 700; font-size: 15px; }
.sect > button .mono { font-weight: 600; min-width: 64px; }
.sect > button .cnt { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 400; opacity: .8; white-space: nowrap; }
.sect > button .chev { transition: transform .15s; }
.sect.closed > button .chev { transform: rotate(-90deg); }
.sect.closed .items { display: none; }

.item { display: grid; grid-template-columns: 74px 1fr auto; gap: 4px 10px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: none; }
.item .nr { font-family: var(--mono); font-size: 12px; color: var(--muted); align-self: start; padding-top: 2px; }
.item .tx { min-width: 0; overflow-wrap: anywhere; }
.item .yn { display: flex; gap: 6px; }
.yn button { width: 46px; height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 700; font-size: 15px; }
.yn button.j[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.yn button.n[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.yn button.e { width: 58px; font-size: 13px; }
.yn button.e[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: var(--surface); }
.item.isN { background: var(--bad-soft); }
.item.isE .tx { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.item .rm { grid-column: 2 / -1; display: flex; gap: 8px; align-items: start; }
.item .meta { grid-column: 2 / -1; font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .meta:empty { display: none; }
.item .hist { grid-column: 2 / -1; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: pre-line; border-left: 2px solid var(--line); padding-left: 8px; font-variant-numeric: tabular-nums; }
.item .hist::first-line { font-family: var(--font); font-weight: 600; }
.item .hist:empty { display: none; }
.item .rmbtn { border: none; background: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 2px 0; }
.item textarea { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--surface); resize: vertical; font-size: 14px; }
.item .rmtext { font-size: 13px; color: var(--muted); font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; }

@media (max-width: 560px) {
  .item { grid-template-columns: 1fr auto; }
  .item .nr { grid-column: 1 / -1; padding: 0; }
  .item .rm, .item .meta, .item .hist { grid-column: 1 / -1; }
}

.dialog { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.dialog > div { background: var(--surface); border-radius: 12px; padding: 20px; max-width: 420px; width: 100%; display: grid; gap: 14px; }
.dialog .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

      else if (state.readOnly) rm.replaceChildren(b ? h("span", { class: "rmtext" }, b) : "");
      else if (b || rm.dataset.open) openRemark(p.id, it, rm, b, false);
      else if (!rm.firstChild) rm.append(h("button", { class: "rmbtn", onclick: () => { rm.dataset.open = "1"; openRemark(p.id, it, rm, "", true); } }, "+ Bemerkung"));
    });
    sec.querySelector(".cnt").textContent = `${done}/${SECTIONS[si].items.length}`;
    sec.hidden = visible === 0;
  });
}

function openRemark(id, it, rm, val, focus) {
  let t;
  const ta = h("textarea", { id: "rm-" + it.key, "aria-label": `Bemerkung zu ${it.nr}`, rows: 2, placeholder: "Bemerkung",
    oninput: e => { clearTimeout(t); const v = e.target.value; t = setTimeout(() => patchDoc(id, { antworten: { [it.key]: { b: v } } }), 600); },
    onblur: e => { clearTimeout(t); const cur = ((state.docs[id].antworten || {})[it.key] || {}).b || ""; if (e.target.value !== cur) patchDoc(id, { antworten: { [it.key]: { b: e.target.value } } }); } });
  ta.value = val; rm.replaceChildren(ta); if (focus) ta.focus();
}

function confirmDelete(p) {
  const ov = $("#overlay");
  const close = () => ov.replaceChildren();
  ov.replaceChildren(h("div", { class: "dialog", onclick: e => { if (e.target === e.currentTarget) close(); } },
    h("div", { role: "dialog", "aria-modal": "true", "aria-labelledby": "dlg-t" },
      h("h2", { id: "dlg-t", style: "font-size:18px" }, "Prüfung löschen?"),
      h("p", { style: "margin:0" }, `„${p.isp}“ und alle Antworten werden auf diesem Gerät gelöscht. Das lässt sich nicht rückgängig machen, außer aus einer Sicherung.`),
      h("div", { class: "actions" },
        h("button", { class: "btn", onclick: close }, "Abbrechen"),
        h("button", { class: "btn danger solid", onclick: async () => {
          try { await store.remove(p.id); close(); state.view = "list"; state.built = null; render(); toast("Prüfung gelöscht"); }
          catch (e) { close(); toast("Löschen fehlgeschlagen. Versuche es erneut."); }
        } }, "Löschen")))));
}

// ---------- Excel export ----------
async function exportXlsx(p) {
  if (!window.ExcelJS) { toast("Excel-Export konnte nicht geladen werden."); return; }
  try {
    const buf = await buildWorkbook(p);
    // file name: Gebäude/Ort_YYYYMMDD_ISP.xlsx
    const clean = s => String(s || "").replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim();
    const name = [clean(p.ort), (p.datum || today()).replace(/-/g, ""), clean(p.isp) || "ISP"].filter(Boolean).join("_") + ".xlsx";
    downloadFile(name, new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    toast("Excel-Datei erstellt");
  } catch (e) { toast("Export fehlgeschlagen: " + (e && e.message || e)); }
}

async function buildWorkbook(p) {
  const a = p.antworten || {}, s = stats(p);
  const C = { band: "FF15191C", head: "FF3A444C", white: "FFFFFFFF", line: "FFC9CECD", zebra: "FFF4F6F5", label: "FFE6E8E6",
    ok: "FF1E7A45", okSoft: "FFD5ECDD", bad: "FFB3261E", badSoft: "FFF6D9D6", muted: "FF5B6670", mutedSoft: "FFE3E6E8", accent: "FF1F5F8B" };
  const F = "Arial";
  const fill = c => ({ type: "pattern", pattern: "solid", fgColor: { argb: c } });
  const thin = { style: "thin", color: { argb: C.line } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };

  const wb = new ExcelJS.Workbook();
  wb.creator = getUser() || "ISP Abnahme App"; wb.created = new Date();
  const ws = wb.addWorksheet("Checkliste", {
    views: [{ state: "frozen", ySplit: 10, showGridLines: false }],
    pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.6, header: 0.2, footer: 0.3 }, printTitlesRow: "10:10" },
    headerFooter: { oddFooter: `&L&8${(p.isp || "").replace(/&/g, "&&")} · Abnahmeprüfung VDI 3814-3&R&8Seite &P von &N` },
  });
  ws.columns = [{ width: 16 }, { width: 62 }, { width: 6 }, { width: 6 }, { width: 9 }, { width: 40 }, { width: 17 }, { width: 22 }];
  const cols = ["A", "B", "C", "D", "E", "F", "G", "H"];

  // title band
  ws.mergeCells("A1:H1");
  Object.assign(ws.getCell("A1"), { value: "Abnahmeprüfung Gebäudeautomation – Checkliste Anhang 7" });
  ws.getCell("A1").font = { name: F, size: 15, bold: true, color: { argb: C.white } };
  ws.getCell("A1").alignment = { vertical: "middle", indent: 1 };
  ws.getRow(1).height = 30;
  ws.mergeCells("A2:H2");
  ws.getCell("A2").value = "Leistungsfeststellung, Abnahme, Übergabe · VDI 3814-3:2007-06";
  ws.getCell("A2").font = { name: F, size: 10, color: { argb: C.white } };
  ws.getCell("A2").alignment = { vertical: "middle", indent: 1 };
  ws.getRow(2).height = 18;
  cols.forEach(c => { ws.getCell(c + "1").fill = fill(C.band); ws.getCell(c + "2").fill = fill(C.band); });

  // header data (left) and summary (right)
  const info = [["ISP", p.isp || ""], ["Gebäude / Ort", p.ort || ""], ["Prüfer", p.pruefer || ""], ["Datum", fmtDate(p.datum)], ["Export", fmtTs(new Date().toISOString())]];
  info.forEach(([k, v], i) => {
    const r = 4 + i;
    ws.mergeCells(`B${r}:E${r}`);
    const kc = ws.getCell("A" + r), vc = ws.getCell("B" + r);
    kc.value = k; kc.font = { name: F, size: 10, bold: true, color: { argb: C.muted } }; kc.fill = fill(C.label);
    vc.value = v; vc.font = { name: F, size: 11, bold: i === 0 };
    ["A", "B", "C", "D", "E"].forEach(c => ws.getCell(c + r).border = box);
    kc.alignment = vc.alignment = { vertical: "middle", indent: 1 };
    ws.getRow(r).height = 18;
  });

  const first = 11; // first data row after header row 10
  const rowsTotal = SECTIONS.reduce((n, sec) => n + 1 + sec.items.length, 0);
  const last = first + rowsTotal - 1;
  const sum = [
    ["J – in Ordnung", `COUNTIF(C${first}:C${last},"X")`, s.j, C.okSoft, C.ok],
    ["N – Mangel", `COUNTIF(D${first}:D${last},"X")`, s.n, C.badSoft, C.bad],
    ["entfällt", `COUNTIF(E${first}:E${last},"X")`, s.e, C.mutedSoft, C.muted],
    ["offen", `${TOTAL}-H4-H5-H6`, s.open, C.label, C.muted],
    ["Fortschritt", `IF(${TOTAL}=0,0,(H4+H5+H6)/${TOTAL})`, s.done / TOTAL, C.label, C.accent],
  ];
  sum.forEach(([k, f, res, bg, fg], i) => {
    const r = 4 + i, kc = ws.getCell("G" + r), vc = ws.getCell("H" + r);
    kc.value = k; kc.font = { name: F, size: 10, bold: true, color: { argb: fg } }; kc.fill = fill(bg);
    vc.value = { formula: f, result: res }; vc.font = { name: F, size: 11, bold: true, color: { argb: fg } };
    vc.alignment = { horizontal: "right", vertical: "middle", indent: 1 }; kc.alignment = { vertical: "middle", indent: 1 };
    if (i === 4) vc.numFmt = "0%";
    kc.border = vc.border = box;
  });

  // table header
  const hr = ws.getRow(10);
  hr.values = ["Nr.", "Prüfpunkt", "J", "N", "entfällt", "Bemerkungen", "Geprüft am", "Geprüft von"];
  hr.height = 22;
  hr.eachCell(c => {
    c.font = { name: F, size: 10, bold: true, color: { argb: C.white } }; c.fill = fill(C.head); c.border = box;
    c.alignment = { vertical: "middle", horizontal: ["C", "D", "E"].includes(c.address.replace(/\d+/, "")) ? "center" : "left", indent: 0 };
  });

  // rows
  const lines = (txt, w) => String(txt || "").split("\n").reduce((n, l) => n + Math.max(1, Math.ceil(l.length / (w * 0.92))), 0);
  // keep item numbers as text: as numbers a German Excel would show "481,1"
  const nrVal = nr => nr;
  let r = first, zebra = false;
  SECTIONS.forEach(sec => {
    const row = ws.getRow(r);
    row.getCell(1).value = nrVal(sec.nr); row.getCell(2).value = sec.title;
    row.getCell(1).alignment = { horizontal: "left" };
    ws.mergeCells(`B${r}:H${r}`);
    cols.forEach(c => { const x = ws.getCell(c + r); x.fill = fill(C.band); x.font = { name: F, size: 10.5, bold: true, color: { argb: C.white } }; x.alignment = { vertical: "middle", horizontal: "left" }; });
    row.height = 20; r++; zebra = false;
    sec.items.forEach(it => {
      const x = a[it.key] || {}, v = x.v || "";
      const row = ws.getRow(r);
      const hl = histLines(x);
      const remark = [x.b || "", hl.length ? "Statusverlauf:\n" + hl.join("\n") : ""].filter(Boolean).join("\n\n");
      row.values = [nrVal(it.nr), it.text, v === "J" ? "X" : "", v === "N" ? "X" : "", v === "E" ? "X" : "", remark, v ? fmtTs(x.t) : "", v ? (x.u || "") : ""];
      const bg = v === "N" ? C.badSoft : (zebra ? C.zebra : C.white);
      cols.forEach((c, ci) => {
        const cell = ws.getCell(c + r);
        cell.border = box; cell.fill = fill(bg);
        cell.font = { name: F, size: 10, color: { argb: v === "E" && ci <= 1 ? C.muted : "FF1D2328" } };
        cell.alignment = { vertical: "top", horizontal: ci === 0 ? "left" : undefined, wrapText: ci === 1 || ci === 5 };
      });
      ws.getCell("A" + r).font = { name: F, size: 9, color: { argb: C.muted } };
      [["C", "J", C.ok, C.okSoft], ["D", "N", C.bad, C.badSoft], ["E", "E", C.muted, C.mutedSoft]].forEach(([c, key, fg, bgc]) => {
        const cell = ws.getCell(c + r);
        cell.alignment = { horizontal: "center", vertical: "top" };
        if (v === key) { cell.fill = fill(fg); cell.font = { name: F, size: 10, bold: true, color: { argb: C.white } }; }
      });
      ["G", "H"].forEach(c => ws.getCell(c + r).font = { name: F, size: 9, color: { argb: C.muted } });
      // remark lines at 10 pt (~13 px), history lines at 8.5 pt (~11 px, fit more per line)
      const remarkH = (x.b ? 13 * lines(x.b, 40) : 0) + (hl.length ? (x.b ? 13 : 0) + 11 * (1 + hl.reduce((n, l) => n + Math.max(1, Math.ceil(l.length / 48)), 0)) : 0);
      row.height = Math.max(16, 13 * lines(it.text, 62) + 4, remarkH + 4);
      if (hl.length) {
        // remark in normal text, history in smaller grey text inside the same cell
        ws.getCell("F" + r).value = { richText: [
          ...(x.b ? [{ text: x.b + "\n\n", font: { name: F, size: 10, color: { argb: "FF1D2328" } } }] : []),
          { text: "Statusverlauf:\n", font: { name: F, size: 8.5, bold: true, color: { argb: C.muted } } },
          { text: hl.join("\n"), font: { name: F, size: 8.5, color: { argb: C.muted } } },
        ] };
      }
      r++; zebra = !zebra;
    });
  });

  // signature block
  r += 2;
  ws.getCell("A" + r).value = "Bestätigung";
  ws.getCell("A" + r).font = { name: F, size: 11, bold: true };
  r += 3;
  [["B", "Ort, Datum"], ["F", "Unterschrift Prüfer"]].forEach(([c, t]) => {
    const cell = ws.getCell(c + r);
    cell.value = t; cell.font = { name: F, size: 9, color: { argb: C.muted } };
    cell.border = { top: { style: "thin", color: { argb: "FF1D2328" } } };
  });
  ws.mergeCells(`F${r}:H${r}`);
  r += 2;
  ws.getCell("A" + r).value = "Quelle: VB BW Amt FR / UNI FR – Richtlinie für technische Anlagen Gebäudeautomation V2.3, Anhang 7, S. 133–135";
  ws.getCell("A" + r).font = { name: F, size: 8, italic: true, color: { argb: C.muted } };

  return wb.xlsx.writeBuffer();
}

render();
store.init();
checkWhatsNew();

// ---------- PWA: offline cache, protected storage, update notice ----------
if ("serviceWorker" in navigator && location.protocol === "https:") {
  // a new version activates itself (skipWaiting); reload once so this window shows it
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    reloading = true;
    const ta = document.activeElement;
    if (ta && ta.tagName === "TEXTAREA") ta.blur(); // saves a remark being typed
    toast("Neue Version wird geladen …");
    setTimeout(() => location.reload(), 600);
  });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    // check for updates whenever the app comes back to the foreground
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist().catch(() => {}); }).catch(() => {});
}
